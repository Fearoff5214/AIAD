<div class="copilot-wrap">
  <div class="copilot-head">
    <h1>GST Copilot</h1>
    <p>Local AI assistant for India GST compliance guidance</p>
  </div>

  <div id="suggested" class="suggested-row"></div>

  <div id="chat" class="chat-box"></div>

  <form id="chat-form" class="input-row">
    <input id="question" type="text" placeholder="Ask about India GST compliance..." autocomplete="off" required>
    <button type="button" id="voice-btn" title="Voice input">Voice</button>
    <button type="submit">Send</button>
  </form>
</div>

<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --line: #d6ddea;
    --ink: #1f2a44;
    --muted: #5c6b89;
    --brand: #0b57d0;
    --assistant: #eef4ff;
    --user: #e8f6ef;
  }

  .copilot-wrap {
    max-width: 920px;
    margin: 24px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(18, 42, 84, 0.08);
    font-family: "Segoe UI", "Calibri", sans-serif;
  }

  .copilot-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(120deg, #fbfdff, #eef3ff);
  }

  .copilot-head h1 {
    margin: 0;
    color: var(--ink);
    font-size: 22px;
  }

  .copilot-head p {
    margin: 4px 0 0;
    color: var(--muted);
  }

  .suggested-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: #fbfdff;
  }

  .suggested-btn {
    border: 1px solid #c7d6f3;
    background: #edf3ff;
    color: #24457a;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .chat-box {
    min-height: 420px;
    max-height: 62vh;
    overflow-y: auto;
    padding: 14px;
    background: var(--bg);
  }

  .bubble {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 10px;
    line-height: 1.45;
    max-width: 85%;
    white-space: pre-wrap;
  }

  .assistant {
    background: var(--assistant);
    color: var(--ink);
    border: 1px solid #d2dff8;
  }

  .user {
    background: var(--user);
    color: #16402d;
    border: 1px solid #cae9d8;
    margin-left: auto;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
    background: #fff;
  }

  .input-row input,
  .input-row button {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
  }

  .input-row button[type="submit"] {
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
  }

  @media (max-width: 700px) {
    .input-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  const chatBox = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const questionInput = document.getElementById("question");
  const suggestedEl = document.getElementById("suggested");
  const voiceBtn = document.getElementById("voice-btn");

  function addBubble(text, role) {
    const el = document.createElement("div");
    el.className = `bubble ${role}`;
    el.textContent = text;
    chatBox.appendChild(el);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function loadSuggestions() {
    const res = await fetch("/api/method/india_compliance.gst_india.api.gst_copilot.gst_copilot_suggested_questions");
    const data = await res.json();
    const questions = (data.message && data.message.questions) || [];

    suggestedEl.innerHTML = "";
    questions.forEach((q) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "suggested-btn";
      btn.textContent = q;
      btn.onclick = () => {
        questionInput.value = q;
        form.requestSubmit();
      };
      suggestedEl.appendChild(btn);
    });
  }

  async function askQuestion(question) {
    addBubble(question, "user");
    addBubble("Thinking...", "assistant");
    const thinkingBubble = chatBox.lastElementChild;

    const payload = { question };
    const res = await fetch("/api/method/india_compliance.gst_india.api.gst_copilot.gst_copilot_chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    const answer = (data.message && data.message.answer) || "No response received.";
    thinkingBubble.textContent = answer;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;
    questionInput.value = "";

    try {
      await askQuestion(question);
    } catch (error) {
      addBubble(`Error: ${error.message}`, "assistant");
    }
  });

  voiceBtn.addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      addBubble("Voice input is not supported in this browser.", "assistant");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      questionInput.value = event.results[0][0].transcript;
    };

    recognition.onerror = () => {
      addBubble("Voice input failed. Please type your question.", "assistant");
    };

    recognition.start();
  });

  addBubble("Hello. Ask me anything about India GST compliance.", "assistant");
  loadSuggestions();
</script>
