<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login – Fearoff AIAD GST Platform</title>
<meta name="description" content="Sign in to the Fearoff AIAD GST Compliance Platform"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0d1117 0%,#0f2c1a 50%,#0d1117 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.wrap{width:100%;max-width:420px}

/* Logo */
.logo{display:flex;align-items:center;gap:.75rem;justify-content:center;margin-bottom:2rem}
.logo-dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);box-shadow:0 0 14px rgba(45,212,191,.5);flex-shrink:0}
.logo-name{font-size:1.35rem;font-weight:800;color:#f0fdfa;letter-spacing:-.01em}
.logo-tag{font-size:.7rem;font-weight:700;color:#2dd4bf;text-transform:uppercase;letter-spacing:.1em}

/* Card */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:2.2rem;backdrop-filter:blur(12px)}
.card-title{font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:.35rem;text-align:center}
.card-sub{font-size:.85rem;color:#64748b;text-align:center;margin-bottom:2rem}

/* Tabs */
.tabs{display:flex;gap:.5rem;margin-bottom:1.8rem;background:rgba(0,0,0,.3);border-radius:12px;padding:.35rem}
.tab{flex:1;padding:.5rem;border:none;border-radius:9px;font-family:inherit;font-size:.83rem;font-weight:600;cursor:pointer;transition:all .2s;background:transparent;color:#64748b}
.tab.active{background:rgba(45,212,191,.15);color:#2dd4bf;border:1px solid rgba(45,212,191,.25)}

/* Form */
.form-group{margin-bottom:1rem}
label{display:block;font-size:.78rem;font-weight:600;color:#94a3b8;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:.75rem 1rem;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.06);color:#e2e8f0;font-family:inherit;font-size:.9rem;transition:border-color .2s;outline:none}
input:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.12)}
input::placeholder{color:#475569}

/* Role chips */
.role-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.role-chip{flex:1;min-width:120px;padding:.6rem;border-radius:10px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s;text-align:center}
.role-chip.selected-admin{border-color:#ef4444;background:rgba(239,68,68,.12)}
.role-chip.selected-user{border-color:#2dd4bf;background:rgba(45,212,191,.12)}
.chip-icon{font-size:1.4rem;display:block;margin-bottom:.2rem}
.chip-label{font-size:.75rem;font-weight:700;color:#94a3b8}
.chip-desc{font-size:.65rem;color:#475569;margin-top:.15rem}

/* Submit */
.submit-btn{width:100%;padding:.8rem;border:none;border-radius:12px;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);color:#fff;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:.5rem}
.submit-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,212,191,.35)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Message */
.msg{text-align:center;font-size:.83rem;margin-top:1rem;padding:.65rem;border-radius:9px;display:none}
.msg-err{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.msg-ok{background:rgba(45,212,191,.12);color:#2dd4bf;border:1px solid rgba(45,212,191,.25)}

/* Footer */
.footer{text-align:center;margin-top:1.4rem;font-size:.78rem;color:#475569}
.footer a{color:#2dd4bf;text-decoration:none;font-weight:600}
.footer a:hover{text-decoration:underline}

/* Separator */
.sep{display:flex;align-items:center;gap:.75rem;margin:1rem 0}
.sep span{flex:1;height:1px;background:rgba(255,255,255,.08)}
.sep em{font-size:.73rem;color:#475569;font-style:normal}

/* Loading spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-name">Fearoff AIAD</div>
      <div class="logo-tag">GST Compliance Platform</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your workspace</div>

    <!-- Role selector -->
    <div class="role-chips">
      <div class="role-chip selected-user" id="chip-user" onclick="selectRole('user')">
        <span class="chip-icon">👤</span>
        <div class="chip-label">User</div>
        <div class="chip-desc">My GST Dashboard</div>
      </div>
      <div class="role-chip" id="chip-admin" onclick="selectRole('admin')">
        <span class="chip-icon">⚙️</span>
        <div class="chip-label">Admin</div>
        <div class="chip-desc">Manage all tenants</div>
      </div>
    </div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="usr">Email Address</label>
        <input type="email" id="usr" name="usr" placeholder="you@company.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="pwd" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="submit-btn" id="login-btn">Sign In</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="sep"><span></span><em>or</em><span></span></div>
    <div class="footer">
      Don't have an account? <a href="/user-register">Create one →</a>
    </div>
  </div>

  <div class="footer" style="margin-top:1rem">
    <a href="/gst-copilot">🤖 GST Copilot</a> &nbsp;·&nbsp;
    <a href="/smart-billing">⚡ Smart Billing</a> &nbsp;·&nbsp;
    <a href="/user-portal">Portal</a>
  </div>
</div>

<script>
let selectedRole = 'user';

function selectRole(role) {
  selectedRole = role;
  document.getElementById('chip-user').className = 'role-chip' + (role === 'user' ? ' selected-user' : '');
  document.getElementById('chip-admin').className = 'role-chip' + (role === 'admin' ? ' selected-admin' : '');
}

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
  el.style.display = 'block';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const usr = document.getElementById('usr').value.trim();
  const pwd = document.getElementById('pwd').value;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';
  document.getElementById('msg').style.display = 'none';

  try {
    // Step 1: Frappe login
    const loginResp = await fetch('/api/method/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest'},
      body: new URLSearchParams({usr, pwd})
    });
    const loginData = await loginResp.json();
    if (loginData.exc_type || !loginResp.ok) {
      showMsg('❌ Incorrect email or password', false);
      btn.disabled = false; btn.textContent = 'Sign In'; return;
    }

    // Step 2: Get user info to determine where to redirect
    const infoResp = await fetch('/api/method/india_compliance.gst_india.api.portal_management.get_current_user_info', {
      headers: {'X-Requested-With': 'XMLHttpRequest'}
    });
    const info = (await infoResp.json()).message || {};

    if (info.redirect_to_login) {
      showMsg('❌ Login failed — please try again', false);
      btn.disabled = false; btn.textContent = 'Sign In'; return;
    }

    // Step 3: Role-based redirect
    if (info.is_admin && selectedRole === 'admin') {
      showMsg('✅ Admin login successful — redirecting…', true);
      setTimeout(() => window.location.href = '/admin-user-management', 600);
    } else if (info.is_admin && selectedRole === 'user') {
      // Admin trying to login as user — still send to admin panel
      showMsg('✅ Login successful — you have admin access', true);
      setTimeout(() => window.location.href = '/admin-user-management', 600);
    } else if (!info.is_admin && selectedRole === 'admin') {
      showMsg('⚠️ This account does not have admin privileges', false);
      btn.disabled = false; btn.textContent = 'Sign In'; return;
    } else {
      // Regular user
      const dest = info.dashboard_url || '/user-portal';
      showMsg('✅ Login successful — redirecting…', true);
      setTimeout(() => window.location.href = dest, 600);
    }
  } catch(err) {
    showMsg('❌ Network error — please try again', false);
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

// On load: if already logged in, redirect immediately
(async () => {
  try {
    const r = await fetch('/api/method/india_compliance.gst_india.api.portal_management.get_current_user_info', {
      headers: {'X-Requested-With': 'XMLHttpRequest'}
    });
    const info = (await r.json()).message || {};
    if (!info.redirect_to_login && info.email) {
      if (info.is_admin) window.location.href = '/admin-user-management';
      else window.location.href = info.dashboard_url || '/user-portal';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
